name: Data pipeline tests
on:
  pull_request:
    paths:
      - 'js/catalog.js'
      - 'js/wikidata.js'
      - 'js/data.js'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline tests
        run: npm test
      - name: Validate existing data
        run: |
          node scripts/backfill-manifest.mjs
          node scripts/validate-data.mjs
          node scripts/report-data.mjs
