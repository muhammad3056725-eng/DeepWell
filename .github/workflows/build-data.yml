name: Build question data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-data.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: comma-separated prompt ids to rebuild (blank = all)'
        required: false
      wide:
        description: 'Search up to 5,000 candidates; save at most 1,000 answers per prompt'
        required: false
        default: 'true'
      batch:
        description: '0-based batch index (0–19 at 500 each); use all to attempt every prompt'
        required: false
        default: '0'
      batch_size:
        description: 'Number of prompts to build in this run'
        required: false
        default: '500'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test (engine + catalog)
        run: node scripts/selftest.mjs

      - name: Build packs from Wikidata
        env:
          ONLY: ${{ github.event.inputs.only }}
          WIDE: ${{ github.event.inputs.wide }}
          BATCH: ${{ github.event.inputs.batch }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$WIDE" != "false" ]; then ARGS+=(--wide); fi
          if [ -z "$BATCH" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              # The first run is kicked off by merging this workflow change.
              BATCH=0
            else
              # Scheduled runs pick a rotating starting batch.
              BATCH=$(( ($(date -u +%s) / 604800) % 20 ))
            fi
          fi
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"
          if [ "$BATCH" != "all" ]; then ARGS+=(--batch "$BATCH" --batch-size "${BATCH_SIZE:-500}"); fi
          node scripts/build-data.mjs "${ARGS[@]}"

      - name: Commit updated data
        run: |
          git config user.name "deepwell-bot"
          git config user.email "deepwell-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update question data $(date -u +%F)"

          # The data build can take a long time. main may advance while it runs.
          # Rebase this data-only commit onto the latest main before pushing.
          # Never force-push: if the same data files conflict, stop safely.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase generated data onto main. No files were pushed; resolve the data conflict manually."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Question data pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; refreshing main before retry."
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts. No force-push was attempted."
          exit 1

      - name: Queue next question-data batch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ github.event.inputs.only }}
          BATCH: ${{ github.event.inputs.batch }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          if [ -n "$ONLY" ]; then
            echo "Targeted build requested; automatic batch chaining is disabled."
            exit 0
          fi
          if [ -z "$BATCH" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              BATCH=0
            else
              BATCH=$(( ($(date -u +%s) / 604800) % 20 ))
            fi
          fi
          if [ "$BATCH" = "all" ]; then
            echo "All-at-once build requested; automatic chaining is disabled."
            exit 0
          fi
          if ! [[ "$BATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid batch index: $BATCH"
            exit 1
          fi
          NEXT_BATCH=$((BATCH + 1))
          if [ "$NEXT_BATCH" -ge 20 ]; then
            echo "Completed the final batch (19)."
            exit 0
          fi
          echo "Queueing batch $NEXT_BATCH of 19."
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/build-data.yml/dispatches" \
            -f ref=main \
            -f 'inputs[wide]=true' \
            -f "inputs[batch]=$NEXT_BATCH" \
            -f "inputs[batch_size]=${BATCH_SIZE:-500}"
