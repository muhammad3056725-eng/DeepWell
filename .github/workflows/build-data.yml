name: Build question data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-data.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: comma-separated prompt ids to rebuild (blank = all)'
        required: false
      wide:
        description: 'Search up to 5,000 candidates; save at most 2,000 answers per prompt'
        required: false
        default: 'true'
      batch:
        description: '0-based batch index (0–19 at 500 each); use all to attempt every prompt'
        required: false
        default: '0'
      batch_size:
        description: 'Prompts per batch (the run stops cleanly at the time budget and continues itself)'
        required: false
        default: '500'
      start:
        description: 'Position inside the batch to start from (used by the automatic continuation)'
        required: false
        default: '0'
      max_minutes:
        description: 'Stop cleanly after this many minutes, save, and continue in a new run'
        required: false
        default: '140'
      candidate_offset:
        description: 'Wikidata candidate page offset; advances every 20-day cycle'
        required: false
        default: '0'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'Bootstrap DeepWell batches')
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test (engine + catalog)
        run: node scripts/selftest.mjs

      - name: Build packs from Wikidata
        env:
          ONLY: ${{ github.event.inputs.only }}
          WIDE: ${{ github.event.inputs.wide }}
          BATCH: ${{ github.event.inputs.batch }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          CANDIDATE_OFFSET: ${{ github.event.inputs.candidate_offset }}
          START: ${{ github.event.inputs.start }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes }}
        run: |
          ARGS=(--max-minutes "${MAX_MINUTES:-140}" --start "${START:-0}")
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$WIDE" != "false" ]; then ARGS+=(--wide); fi
          if [ -z "$BATCH" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              BATCH=0
              CANDIDATE_OFFSET=0
            else
              # Rotate 500-prompt slices; advance candidate page every 20 days.
              TODAY_INDEX=$(( $(date -u +%s) / 86400 ))
              ANCHOR_INDEX=$(( $(date -u -d '2026-11-21' +%s) / 86400 ))
              DAY_INDEX=$(( TODAY_INDEX - ANCHOR_INDEX ))
              if [ "$DAY_INDEX" -lt 0 ]; then DAY_INDEX=0; fi
              # All real prompts fit in batch 0 (letter variants are derived in the game), so every day
              # rebuilds them all and pages one step deeper into Wikidata's candidates (cycles every 6 days).
              BATCH=0
              CANDIDATE_OFFSET=$(( (DAY_INDEX % 6) * 5000 ))
            fi
          fi
          CANDIDATE_OFFSET=${CANDIDATE_OFFSET:-0}
          echo "BUILT_BATCH=$BATCH" >> "$GITHUB_ENV"
          echo "BUILT_OFFSET=$CANDIDATE_OFFSET" >> "$GITHUB_ENV"
          if [ "$BATCH" != "all" ]; then ARGS+=(--batch "$BATCH" --batch-size "${BATCH_SIZE:-500}"); fi
          ARGS+=(--candidate-offset "$CANDIDATE_OFFSET")
          node scripts/build-data.mjs "${ARGS[@]}"

      - name: Backfill legacy manifest metadata and validate data
        run: |
          node scripts/backfill-manifest.mjs
          node scripts/validate-data.mjs
          node scripts/report-data.mjs

      - name: Commit updated data
        run: |
          git config user.name "deepwell-bot"
          git config user.email "deepwell-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update question data $(date -u +%F)"

          # The data build can take a long time. main may advance while it runs.
          # Rebase this data-only commit onto the latest main before pushing.
          # Never force-push: if the same data files conflict, stop safely.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase generated data onto main. No files were pushed; resolve the data conflict manually."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Question data pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; refreshing main before retry."
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts. No force-push was attempted."
          exit 1

      - name: Queue next question-data run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ github.event.inputs.only }}
          BATCH: ${{ github.event.inputs.batch }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          CANDIDATE_OFFSET: ${{ github.event.inputs.candidate_offset }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes }}
        run: |
          if [ -n "$ONLY" ]; then
            echo "Targeted build requested; automatic chaining is disabled."
            exit 0
          fi
          # Where did the build stop? (null = the batch finished)
          STOPPED=$(node -e "try{const r=JSON.parse(require('fs').readFileSync('data/BUILD-REPORT.json','utf8'));console.log(r.stoppedAt??'')}catch{console.log('')}")
          BATCH="${BATCH:-$BUILT_BATCH}"
          CANDIDATE_OFFSET="${CANDIDATE_OFFSET:-$BUILT_OFFSET}"
          if [ "$BATCH" = "all" ]; then
            echo "All-at-once build requested; automatic chaining is disabled."
            exit 0
          fi
          if ! [[ "$BATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid batch index: $BATCH"
            exit 1
          fi
          if [ -n "$STOPPED" ]; then
            echo "Batch $BATCH stopped at position $STOPPED (time budget). Continuing the same batch."
            NEXT_BATCH=$BATCH
            NEXT_START=$STOPPED
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Scheduled run finished its batch."
            exit 0
          else
            echo "Batch $BATCH finished; all real prompts are covered. Nothing more to queue."
            exit 0
          fi
          echo "Queueing batch $NEXT_BATCH from position $NEXT_START."
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/build-data.yml/dispatches" \
            -f ref=main \
            -f 'inputs[wide]=true' \
            -f "inputs[batch]=$NEXT_BATCH" \
            -f "inputs[start]=$NEXT_START" \
            -f "inputs[max_minutes]=${MAX_MINUTES:-140}" \
            -f "inputs[batch_size]=${BATCH_SIZE:-500}" \
            -f "inputs[candidate_offset]=${CANDIDATE_OFFSET:-0}"
